<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 - LawLex</title>
  <style>
    @font-face {
      font-family: 'Gooorm Sans';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Gooorm Sans';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Gooorm Sans';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    .page-gnaList * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .page-gnaList {
      font-family: 'Gooorm Sans', 'Pretendard Variable', 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, sans-serif;
      background-color: #ffffff;
      color: #000;
      line-height: 1.6;
      --navy: #000777;
      --accent: #ffee00;
      --line: #e2e6ff;
      --muted: #6b7280;
      --panel: #f8f9fa;
      --hover: #f0f0f0;
    }

    .page-gnaList .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page-gnaList .qna-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .page-gnaList .qna-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 16px;
    }

    .page-gnaList .search-wrapper {
      flex: 1;
      max-width: 400px;
    }

    .page-gnaList .search-box {
      position: relative;
      width: 100%;
    }

    .page-gnaList .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #666;
    }

    .page-gnaList .search-input {
      width: 100%;
      padding: 10px 12px 10px 40px;
      border: 1px solid var(--line);
      border-bottom: 2px solid var(--accent);
      background-color: #FFFEF0;
      font-size: 14px;
      outline: none;
    }

    .page-gnaList .search-input::placeholder {
      color: #999;
    }

    .page-gnaList .my-posts-btn {
      padding: 10px 20px;
      background-color: var(--navy);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .page-gnaList .my-posts-btn:hover {
      background-color: #001366;
    }

    .page-gnaList .qna-table-wrapper {
      background-color: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .page-gnaList .qna-table {
      width: 100%;
      border-collapse: collapse;
    }

    .page-gnaList .qna-table thead {
      background-color: var(--panel);
      border-bottom: 2px solid var(--navy);
    }

    .page-gnaList .qna-table th {
      padding: 16px 12px;
      text-align: center;
      font-weight: 500;
      font-size: 14px;
      color: #111;
    }

    .page-gnaList .qna-table tbody tr {
      border-bottom: 1px solid #eee;
      transition: background-color .2s;
    }

    .page-gnaList .qna-table tbody tr:hover {
      background-color: var(--panel);
    }

    .page-gnaList .qna-table tbody tr:last-child {
      border-bottom: none;
    }

    .page-gnaList .qna-table td {
      padding: 16px 12px;
      text-align: center;
      font-size: 14px;
      color: #444;
      vertical-align: middle;
    }

    .page-gnaList .qna-table td:nth-child(2) {
      text-align: left;
    }

    .page-gnaList .title-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-gnaList .lock-icon {
      width: 16px;
      height: 16px;
      color: #999;
      flex-shrink: 0;
    }

    .page-gnaList .title-link {
      color: #111;
      text-decoration: none;
    }

    .page-gnaList .title-link:hover {
      color: var(--navy);
      text-decoration: underline;
    }

    .page-gnaList .secret-text {
      color: #999;
      font-style: italic;
    }

    .page-gnaList .check-icon {
      width: 20px;
      height: 20px;
      color: #19a672;
    }

    .page-gnaList .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .page-gnaList .page-arrow {
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: #999;
      cursor: pointer;
      transition: color .2s;
      font-size: 18px;
      line-height: 1;
    }

    .page-gnaList .page-arrow:hover {
      color: var(--navy);
    }

    .page-gnaList .page-arrow.disabled {
      color: #ddd;
      cursor: not-allowed;
    }

    .page-gnaList .page-number {
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      border-radius: 4px;
      transition: all .2s;
    }

    .page-gnaList .page-number:hover {
      background-color: var(--hover);
      color: var(--navy);
    }

    .page-gnaList .page-number.active {
      background-color: var(--navy);
      color: #fff;
      font-weight: 500;
    }

    .page-gnaList .qna-footer {
      display: flex;
      justify-content: flex-end;
    }

    .page-gnaList .write-btn {
      padding: 12px 30px;
      background-color: var(--navy);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .page-gnaList .write-btn:hover {
      background-color: #001366;
    }

    @media (max-width:768px) {
      .page-gnaList .qna-container {
        padding: 40px 15px;
      }

      .page-gnaList .qna-header {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
      }

      .page-gnaList .search-wrapper {
        max-width: 100%;
      }

      .page-gnaList .qna-table th:nth-child(1),
      .page-gnaList .qna-table td:nth-child(1) {
        display: none;
      }

      .page-gnaList .qna-table th,
      .page-gnaList .qna-table td {
        padding: 12px 8px;
        font-size: 13px;
      }
    }
  </style>
</head>

          </tbody>
        </table>
      </div>
      <div class="pagination" role="navigation" aria-label="페이지네이션">
        <button class="page-arrow prev disabled" type="button" aria-disabled="true" title="이전 페이지">&lt;</button>
        <div class="page-number active">1</div>
        <div class="page-number">2</div>

  </main>
  <script>
    const rootEl = document.querySelector('.page-gnaList');
    const searchInput = rootEl.querySelector('.search-input');
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { const v = this.value.trim(); if (v) { console.log('Searching for:', v); } }
    });
    const myPostsBtn = rootEl.querySelector('.my-posts-btn');
    myPostsBtn.addEventListener('click', function () { console.log('Show only my posts'); });
    rootEl.querySelectorAll('.title-link').forEach(a => {
      a.addEventListener('click', function (e) {
        if (this.getAttribute('href') === '#') { e.preventDefault(); console.log('Navigate to QnA detail page'); }
      });
    });
    let currentPage = 1;
    const pageNumbers = rootEl.querySelectorAll('.page-number');
    pageNumbers.forEach(el => {
      el.addEventListener('click', function () {
        const page = parseInt(this.textContent, 10);
        currentPage = page;
        pageNumbers.forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        console.log('Navigate to page:', page);
      });
    });
    rootEl.querySelectorAll('.page-arrow').forEach(btn => {
      btn.addEventListener('click', function () { if (this.classList.contains('disabled')) return; console.log('Navigate to page'); });
    });
    const writeBtn = rootEl.querySelector('.write-btn');
    writeBtn.addEventListener('click', function () { console.log('Navigate to QnA write page'); });
  </script>

</html>
