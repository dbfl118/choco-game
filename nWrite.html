<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEWS 작성</title><style>
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
:root{--navy:#000777;--ink:#0f172a;--muted:#667085;--line:#e2e6ff;--soft:#eef2ff;--paper:#ffffff;--media:760px;}
.page-nWrite *{box-sizing:border-box;margin:0;padding:0;}
.page-nWrite{background:var(--paper);color:var(--ink);font-family:'Gooorm Sans','Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,sans-serif;line-height:1.65;}
.page-nWrite .wrap{width:min(920px,94%);margin:80px auto;}
.page-nWrite .title{font-size:28px;font-weight:700;letter-spacing:-0.01em;margin:0 0 12px;}
.page-nWrite .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);overflow:hidden;}
.page-nWrite .inner{padding:18px;}
.page-nWrite .field{display:flex;gap:12px;align-items:center;margin:12px 0;}
.page-nWrite label{width:100px;font-weight:600;}
.page-nWrite input[type='text'],.page-nWrite input[type='date']{flex:1;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;outline:none;}
.page-nWrite input[type='text']:focus,.page-nWrite input[type='date']:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,7,119,.08);}
.page-nWrite textarea{flex:1;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:10px;resize:none;outline:none;}
.page-nWrite textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,7,119,.08);}
.page-nWrite .hero{width:min(var(--media),100%);margin:0 auto 12px;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#4b5563;}
.page-nWrite .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.page-nWrite .btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer;transition:transform .08s;}
.page-nWrite .btn.secondary{background:#fff;color:var(--navy);}
.page-nWrite .btn:hover{transform:translateY(-1px);}
.page-nWrite .btn:active{transform:translateY(0);}
.page-nWrite .msg{display:none;margin-top:10px;font-size:14px;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;padding:10px 12px;border-radius:10px;}
</style></head><body>
<main class="page-nWrite"><div class="wrap">
<h1 class="title">NEWS 작성</h1>
<section class="card"><div class="inner">
<div class="field"><label for="date">작성일</label><input id="date" type="date"></div>
<div class="field"><label for="author">작성자</label><input id="author" type="text" placeholder="관리자"></div>
<div class="field"><label for="title">제목</label><input id="title" type="text" placeholder="뉴스 제목을 입력하세요."></div>
<div class="field"><label for="summary">요약</label><input id="summary" type="text" placeholder="한 줄 요약을 입력하세요."></div>
<div class="field" style="align-items:flex-start"><label>대표 이미지</label><div class="hero" aria-label="대표 이미지">4:3 (최대 760px)</div></div>
<div class="field" style="align-items:flex-start"><label for="body">본문</label><textarea id="body" placeholder="본문을 입력하세요. (최소 30자)"></textarea></div>
<div class="btns"><button type="button" id="btnSubmit" class="btn">등록</button><button type="button" id="btnReset" class="btn secondary">초기화</button></div>
<div id="msg" class="msg">등록 완료! (프론트 미리보기)</div>
</div></section>
</div></main>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const date=$('#date'), author=$('#author'), title=$('#title'), summary=$('#summary'), body=$('#body'), msg=$('#msg');
  const btnS=$('#btnSubmit'), btnR=$('#btnReset');
  function valid(){return author.value.trim() && title.value.trim() && summary.value.trim() && body.value.trim().length>=30;}
  function lock(d){[date,author,title,summary,body,btnS,btnR].forEach(el=>el.disabled=d);}
  btnS.addEventListener('click',function(){ if(!valid()){msg.style.display='block';msg.style.color='#b91c1c';msg.textContent='작성자, 제목, 요약, 본문(30자↑)을 입력하세요.'; return;} msg.style.display='block';msg.style.color='#065f46';msg.textContent='등록 완료! (프론트 미리보기)'; lock(true);});
  btnR.addEventListener('click',function(){[author,title,summary,body].forEach(el=>el.value=''); date.value=''; msg.style.display='none';});
  const d=new Date(); const z=n=>String(n).padStart(2,'0'); date.value=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
})();
</script></body></html>
