<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NEWS 보기</title><style>
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
:root{--navy:#000777;--ink:#0f172a;--muted:#667085;--line:#e2e6ff;--soft:#eef2ff;--paper:#ffffff;--media:760px;}
.page-nView *{box-sizing:border-box;margin:0;padding:0;}
.page-nView{background:var(--paper);color:var(--ink);font-family:'Gooorm Sans','Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,sans-serif;line-height:1.7;}
.page-nView .wrap{width:min(950px,94%);margin:90px auto;border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);padding:18px 0 28px;}
.page-nView .title{font-size:30px;font-weight:700;margin:0 0 8px;}
.page-nView .meta{display:flex;justify-content:space-between;align-items:center;color:#444;font-size:14px;margin:0 0 12px;}
.page-nView .media{width:min(var(--media),100%);aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;background:#d9d9d9;color:#444;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.page-nView .article .para{margin:0 0 12px;}
.page-nView .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.page-nView .btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:#000777;font-weight:700;cursor:pointer;}
.page-nView .cmt{margin-top:26px;}
.page-nView .cmt h3{font-size:20px;font-weight:700;margin:0 0 10px;}
.page-nView .inputbar{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;}
.page-nView .inputbar textarea{flex:1;min-height:84px;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.6;background:#fff;outline:none;}
.page-nView .inputbar textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,7,119,.08);}
.page-nView table{width:100%;border-collapse:collapse;margin-top:12px;}
.page-nView td{border-bottom:1px solid #ececec;padding:12px 10px;vertical-align:top;}
.page-nView td:nth-child(1){width:120px;color:#555;}
.page-nView td:nth-child(3){width:140px;color:#666;text-align:right;}
.page-nView .warn{color:#b91c1c;font-size:13px;margin-top:6px;display:none;}
</style></head><body>
<main class="page-nView"><div class="wrap">
<h1 class="title">사법 개혁안 공청회 개최</h1>
<div class="meta"><span>2025-10-30</span><span>조회수 65</span></div>
<div class="media" aria-label="대표 이미지 / 동영상 박스">기사에 나오는 사진 (4:3, 최대 760px)</div>
<section class="article">
  <div class="para">전자소송 확대, 민사소송 절차 단축에 대한 공개 토론이 열립니다.</div>
  <div class="para">이번 공청회는 각계 전문가의 의견을 수렴하고 제도 개선 방향을 논의하는 자리입니다.</div>
  <div class="para">시민 참여가 가능하며, 온라인 생중계도 함께 진행됩니다.</div>
</section>
<div class="actions"><button class="btn">목록</button><button class="btn">수정</button><button class="btn">삭제</button></div>
<section class="cmt">
  <h3>댓글</h3>
  <div class="inputbar"><textarea id="cmtInput" placeholder="댓글을 입력하세요. (Ctrl+Enter 등록)"></textarea><button type="button" id="cmtBtn" class="btn">등록</button></div>
  <div id="warn" class="warn">내용을 입력하세요.</div>
  <table><tbody id="cmtBody"><tr><td>닉네임</td><td>현장의 의견이 충분히 반영되면 좋겠네요.</td><td>2025-10-30</td></tr></tbody></table>
</section>
</div></main>
<script>
(function(){
  const input=document.getElementById('cmtInput');
  const btn=document.getElementById('cmtBtn');
  const body=document.getElementById('cmtBody');
  const warn=document.getElementById('warn');
  function ymd(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
  function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',\"'\":'&#39;'}[m]));}
  function submit(){
    const txt=input.value.trim();
    if(!txt){warn.style.display='block';input.focus();return;}
    warn.style.display='none';
    const tr=document.createElement('tr');
    const td1=document.createElement('td');td1.textContent='방문자';
    const td2=document.createElement('td');td2.innerHTML=escapeHTML(txt).replace(/\\n/g,'<br>');
    const td3=document.createElement('td');td3.textContent=ymd(new Date());
    tr.append(td1,td2,td3); body.insertBefore(tr, body.firstChild);
    input.value=''; input.focus();
  }
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.ctrlKey && e.key==='Enter') submit(); });
})();
</script></body></html>
