<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원 정보수정</title>
<style>
@font-face {
  font-family: 'Gooorm Sans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-400.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'Gooorm Sans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-500.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
}
@font-face {
  font-family: 'Gooorm Sans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-700.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
}

:root{
  --navy:#000777;
  --ink:#000000;
  --muted:#6b7280;
  --panel:#fff;
  --panel-bg:#f5f6f8;
  --line:#e2e6ff;
  --shadow-card:0 12px 32px rgba(0,0,0,.08);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--panel-bg);
  color:var(--ink);
  line-height:1.5;
  font-family:"Gooorm Sans","Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.center-card{
  width:min(720px,92%);
  margin:100px auto;
  background:#fff;
  border-radius:16px;
  box-shadow:var(--shadow-card);
  padding:40px 36px 50px;
  border:1px solid var(--line);
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:32px;
}
.title{
  flex:1;
  text-align:center;
  font-size:32px;
  font-weight:800;
  letter-spacing:-0.02em;
  margin:0;
  color:var(--ink);
}
.role-badge{
  font-size:12px;
  font-weight:700;
  line-height:1;
  padding:4px 8px;
  border-radius:999px;
  background:#eef2ff;
  color:var(--navy);
}

.form{
  width:min(560px,100%);
  margin:0 auto;
}
.field{
  margin-bottom:28px;
  display:grid;
  grid-template-columns:120px 1fr;
  gap:8px 16px;
  align-items:flex-start;
}
@media(max-width:560px){
  .field{grid-template-columns:100px 1fr;}
}
.label{
  font-size:14px;
  font-weight:500;
  color:var(--ink);
  line-height:1.4;
}
.input-wrap{width:100%;}
.input,
.code-input{
  width:100%;
  border:none;
  border-bottom:1px solid var(--line);
  padding:12px 0 10px;
  background:transparent;
  font-size:16px;
  outline:none;
  color:var(--ink);
  font-family:inherit;
}
.input::placeholder,
.code-input::placeholder{color:#a8a8a8;}
.input[readonly]{color:#111;background:transparent;cursor:default;}

.phone-flex{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:flex-start;
}
.phone-flex .input{
  flex:1;
  min-width:140px;
}
.verify-btn{
  flex:0 0 auto;
  background:#000;
  color:#fff;
  border:1px solid #000;
  border-radius:8px;
  font-size:12px;
  line-height:1;
  padding:10px 12px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.verify-btn.confirm{
  background:#000777;
  border-color:#000777;
}
.verify-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
  align-items:flex-start;
}
.verify-row .code-input{
  flex:1;
  min-width:140px;
}
.verify-hint{
  font-size:12px;
  color:#6b7280;
  margin:6px 0 0;
  line-height:1.4;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  height:32px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  cursor:pointer;
  font-size:13px;
  line-height:1;
  color:var(--ink);
  background:#fff;
}
.chip input{
  appearance:none;
  width:14px;
  height:14px;
  border:1.6px solid #94a3b8;
  border-radius:3px;
  display:grid;
  place-content:center;
  margin:0;
}
.chip input:checked{
  background:var(--navy);
  border-color:var(--navy);
}

.profile-block{
  width:min(560px,100%);
  margin:0 auto 32px;
}
.inline-top{
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  align-items:flex-start;
}
@media(max-width:560px){
  .inline-top{flex-direction:column;}
}
.photo-area{
  flex:0 0 120px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
}
.photo-box{
  width:120px;
  height:160px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  font-size:13px;
  line-height:1.3;
  overflow:hidden;
}
.photo-box img{
  max-width:100%;
  max-height:100%;
  object-fit:cover;
  display:block;
}
.photo-actions{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.photo-upload-btn{
  background:#000;
  color:#fff;
  border:1px solid #000;
  border-radius:8px;
  font-size:12px;
  line-height:1;
  padding:8px 10px;
  font-weight:600;
  cursor:pointer;
  text-align:center;
  white-space:nowrap;
}
.photo-upload-btn.sub{
  background:#000777;
  border-color:#000777;
}
#gPhotoInput{display:none;}

.actions{
  width:min(560px,100%);
  margin:40px auto 0;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.btn-main{
  cursor:pointer;
  border:none;
  border-radius:10px;
  height:42px;
  padding:0 16px;
  font-size:15px;
  font-weight:700;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--navy);
  color:#fff;
}
.btn-ghost{
  background:#eceff3;
  color:#000;
  border:1.6px solid var(--line);
}

@media(max-width:560px){
  .phone-flex{flex-direction:column;align-items:stretch;}
  .verify-row{flex-direction:column;align-items:stretch;}
  .verify-btn{width:auto;}
}
</style>
</head>
<body>

<main class="page-gModify">
  <section class="center-card">
    <div class="head">
      <h1 class="title">정보수정</h1>
      <span class="role-badge">일반회원</span>
    </div>

    <form class="form" action="#" method="post">

      <div class="field">
        <label class="label" for="id_g">아이디</label>
        <div class="input-wrap">
          <input class="input" id="id_g" name="id_g" type="text" value="user123" readonly>
        </div>
      </div>

      <div class="field">
        <label class="label" for="pw_g">비밀번호</label>
        <div class="input-wrap">
          <input class="input" id="pw_g" name="pw_g" type="password" placeholder="비밀번호 입력">
        </div>
      </div>

      <div class="field">
        <label class="label" for="pw2_g">비밀번호 확인</label>
        <div class="input-wrap">
          <input class="input" id="pw2_g" name="pw2_g" type="password" placeholder="비밀번호 확인">
        </div>
      </div>

      <div class="field">
        <label class="label" for="nick_g">닉네임</label>
        <div class="input-wrap">
          <input class="input" id="nick_g" name="nick_g" type="text" placeholder="닉네임">
        </div>
      </div>

      <div class="field">
        <label class="label" for="email_g">이메일</label>
        <div class="input-wrap">
          <input class="input" id="email_g" name="email_g" type="email" placeholder="이메일 입력">
        </div>
      </div>

      <div class="field">
        <label class="label" for="tel_g">전화번호</label>
        <div class="input-wrap">
          <div class="phone-flex">
            <input class="input" id="tel_g" name="tel_g" type="text" placeholder="전화번호 입력">
            <button type="button" class="verify-btn">인증 요청</button>
          </div>

          <div class="verify-row">
            <input class="code-input" id="code_g" name="code_g" type="text" placeholder="인증번호 입력">
            <button type="button" class="verify-btn confirm">확인</button>
          </div>

          <p class="verify-hint">전화번호 변경 시 본인 확인이 필요합니다.</p>
        </div>
      </div>

      <div class="field">
        <span class="label">관심분야</span>
        <div class="input-wrap">
          <div class="chips">
            <label class="chip"><input type="checkbox" name="cate[]" value="성범죄"> 성범죄</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="재산범죄"> 재산범죄</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="교통사고 · 범죄"> 교통사고 · 범죄</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="폭행 · 협박"> 폭행 · 협박</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="명예훼손 · 모욕"> 명예훼손 · 모욕</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="부동산 · 임대차"> 부동산 · 임대차</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="금전 · 계약 문제"> 금전 · 계약 문제</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="가족"> 가족</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="회사"> 회사</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="의료 · 세금 · 행정"> 의료 · 세금 · 행정</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="지식재산 · 금융"> 지식재산 · 금융</label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-main btn-ghost" type="button">취소</button>
        <button class="btn-main" id="saveBtnUser" type="submit">회원수정</button>
      </div>

    </form>
  </section>
</main>

<script>
(function(){
  const telInput=document.getElementById('tel_g');
  const reqBtn=document.querySelector('.phone-flex .verify-btn');
  const codeInput=document.getElementById('code_g');
  const confirmBtn=document.querySelector('.verify-row .verify-btn.confirm');
  let requested=false,verified=false;

  reqBtn.addEventListener('click',function(){
    if(verified)return;
    requested=true;
    telInput.readOnly=true;
    reqBtn.disabled=true;
    reqBtn.textContent='요청됨';
  });

  confirmBtn.addEventListener('click',function(){
    if(!requested||verified)return;
    const codeVal=codeInput.value.trim();
    if(!codeVal){alert('인증번호를 입력하세요');return;}
    verified=true;
    confirmBtn.disabled=true;
    confirmBtn.textContent='인증완료';
    telInput.readOnly=true;
    reqBtn.disabled=true;
    reqBtn.textContent='완료됨';
  });

  telInput.addEventListener('input',function(){
    requested=false;
    verified=false;
    reqBtn.disabled=false;
    reqBtn.textContent='인증 요청';
    confirmBtn.disabled=false;
    confirmBtn.textContent='확인';
    codeInput.value='';
  });

  const gPhotoInput=document.getElementById('gPhotoInput');
  const gPhotoPreview=document.getElementById('gPhotoPreview');
  const gPhotoRemoveBtn=document.getElementById('gPhotoRemoveBtn');

  if(gPhotoInput){
    gPhotoInput.addEventListener('change',function(){
      const file=this.files&&this.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=function(e){
        gPhotoPreview.innerHTML='<img src="'+e.target.result+'" alt="미리보기">';
      };
      reader.readAsDataURL(file);
    });
  }

  if(gPhotoRemoveBtn){
    gPhotoRemoveBtn.addEventListener('click',function(){
      gPhotoInput.value='';
      gPhotoPreview.innerHTML='<span>사진</span>';
    });
  }
})();
</script>

</body>
</html>
