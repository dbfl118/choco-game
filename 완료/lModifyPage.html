<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변호사 정보수정</title>
<style>
@font-face {
  font-family: 'Gooorm Sans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-400.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'Gooorm Sans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-500.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
}
@font-face {
  font-family: 'Gooorm Sans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-700.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
}

:root{
  --navy:#000777;
  --ink:#000000;
  --muted:#6b7280;
  --panel:#fff;
  --panel-bg:#f5f6f8;
  --line:#e2e6ff;
  --shadow-card:0 12px 32px rgba(0,0,0,.08);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--panel-bg);
  color:var(--ink);
  line-height:1.5;
  font-family:"Gooorm Sans","Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.center-card{
  width:min(720px,92%);
  margin:100px auto;
  background:#fff;
  border-radius:16px;
  box-shadow:var(--shadow-card);
  padding:40px 36px 50px;
  border:1px solid var(--line);
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:32px;
}
.title{
  flex:1;
  text-align:center;
  font-size:32px;
  font-weight:800;
  letter-spacing:-0.02em;
  margin:0;
  color:var(--ink);
}
.role-badge{
  font-size:12px;
  font-weight:700;
  line-height:1;
  padding:4px 8px;
  border-radius:999px;
  background:#eef2ff;
  color:var(--navy);
}

.form{
  width:min(560px,100%);
  margin:0 auto;
}
.field{
  margin-bottom:28px;
  display:grid;
  grid-template-columns:120px 1fr;
  gap:8px 16px;
  align-items:flex-start;
}
@media(max-width:560px){
  .field{grid-template-columns:100px 1fr;}
}
.label{
  font-size:14px;
  font-weight:500;
  color:var(--ink);
  line-height:1.4;
}
.input-wrap{width:100%;}
.input,
.time-input,
.code-input{
  width:100%;
  border:none;
  border-bottom:1px solid var(--line);
  padding:12px 0 10px;
  background:transparent;
  font-size:16px;
  outline:none;
  color:var(--ink);
  font-family:inherit;
}
.input::placeholder,
.time-input::placeholder,
.code-input::placeholder{color:#a8a8a8;}
.input[readonly]{color:#111;background:transparent;cursor:default;}

.phone-flex{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:flex-start;
}
.phone-flex .input{
  flex:1;
  min-width:140px;
}
.verify-btn{
  flex:0 0 auto;
  background:#000;
  color:#fff;
  border:1px solid #000;
  border-radius:8px;
  font-size:12px;
  line-height:1;
  padding:10px 12px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.verify-btn.confirm{
  background:#000777;
  border-color:#000777;
}
.verify-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
  align-items:flex-start;
}
.verify-row .code-input{
  flex:1;
  min-width:140px;
}
.verify-hint{
  font-size:12px;
  color:#6b7280;
  margin:6px 0 0;
  line-height:1.4;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  height:32px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  cursor:pointer;
  font-size:13px;
  line-height:1;
  color:var(--ink);
  background:#fff;
}
.chip input{
  appearance:none;
  width:14px;
  height:14px;
  border:1.6px solid #94a3b8;
  border-radius:3px;
  display:grid;
  place-content:center;
  margin:0;
}
.chip input:checked{
  background:var(--navy);
  border-color:var(--navy);
}

.profile-block{
  width:min(560px,100%);
  margin:0 auto 32px;
}
.inline-top{
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  align-items:flex-start;
}
@media(max-width:560px){
  .inline-top{flex-direction:column;}
}
.photo-area{
  flex:0 0 120px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
}
.photo-box{
  width:120px;
  height:160px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  font-size:13px;
  line-height:1.3;
  overflow:hidden;
}
.photo-box img{
  max-width:100%;
  max-height:100%;
  object-fit:cover;
  display:block;
}
.photo-actions{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.photo-upload-btn{
  background:#000;
  color:#fff;
  border:1px solid #000;
  border-radius:8px;
  font-size:12px;
  line-height:1;
  padding:8px 10px;
  font-weight:600;
  cursor:pointer;
  text-align:center;
  white-space:nowrap;
}
.photo-upload-btn.sub{
  background:#000777;
  border-color:#000777;
}
#photoInput{display:none;}

.profile-col{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:16px;
  font-size:14px;
  line-height:1.4;
}
.sub-label{
  font-size:13px;
  font-weight:500;
  color:#6b7280;
  line-height:1.4;
  margin-bottom:4px;
}
.sub-label.mainline{
  margin-bottom:8px;
  color:var(--ink);
  font-weight:500;
}
.days-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}
.days-row input{display:none;}
.days-row label{
  border:1px solid var(--line);
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  line-height:1.2;
  background:#fff;
  color:var(--ink);
}
.days-row input:checked + label{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}
.time-block{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.time-input{
  flex:0 0 auto;
  width:110px;
  border:none;
  border-bottom:1px solid var(--line);
  padding:8px 0;
  font-size:15px;
  background:transparent;
  outline:none;
  color:var(--ink);
  font-family:inherit;
}
.time-tilde{
  font-size:14px;
  color:var(--ink);
  line-height:1;
}
.small-btn{
  background:#000777;
  color:#fff;
  border:1px solid #000777;
  border-radius:8px;
  font-size:12px;
  padding:8px 12px;
  line-height:1;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.small-btn:hover{opacity:.9;}
.selected-list{
  font-size:14px;
  color:#333;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.tag-slot{
  display:inline-flex;
  align-items:center;
  background:#eef1ff;
  color:#000777;
  border:1px solid #cfd3ff;
  border-radius:999px;
  padding:4px 8px;
  line-height:1.2;
  font-weight:500;
  gap:6px;
  font-size:13px;
}
.tag-remove{
  background:none;
  border:none;
  color:#64748b;
  cursor:pointer;
  font-size:13px;
  line-height:1;
  padding:0;
}

.actions{
  width:min(560px,100%);
  margin:40px auto 0;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.btn-main{
  cursor:pointer;
  border:none;
  border-radius:10px;
  height:42px;
  padding:0 16px;
  font-size:15px;
  font-weight:700;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--navy);
  color:#fff;
}
.btn-ghost{
  background:#eceff3;
  color:var(--ink);
  border:1.6px solid var(--line);
}

@media(max-width:560px){
  .phone-flex{flex-direction:column;align-items:stretch;}
  .verify-row{flex-direction:column;align-items:stretch;}
  .verify-btn{width:auto;}
}
</style>
</head>
<body>

<main class="page-lModify">
  <section class="center-card">
    <div class="head">
      <h1 class="title">정보수정</h1>
      <span class="role-badge">변호사</span>
    </div>

    <form class="form" action="#" method="post" enctype="multipart/form-data">

      <div class="field">
        <label class="label" for="id_l">아이디</label>
        <div class="input-wrap">
          <input class="input" id="id_l" name="id_l" type="text" value="lawyer123" readonly>
        </div>
      </div>

      <div class="field">
        <label class="label" for="pw_l">비밀번호</label>
        <div class="input-wrap">
          <input class="input" id="pw_l" name="pw_l" type="password" placeholder="비밀번호 입력">
        </div>
      </div>

      <div class="field">
        <label class="label" for="pw2_l">비밀번호 확인</label>
        <div class="input-wrap">
          <input class="input" id="pw2_l" name="pw2_l" type="password" placeholder="비밀번호 확인">
        </div>
      </div>

      <div class="field">
        <label class="label" for="nick_l">닉네임</label>
        <div class="input-wrap">
          <input class="input" id="nick_l" name="nick_l" type="text" placeholder="닉네임">
        </div>
      </div>

      <div class="field">
        <label class="label" for="email_l">이메일</label>
        <div class="input-wrap">
          <input class="input" id="email_l" name="email_l" type="email" placeholder="이메일 입력">
        </div>
      </div>

      <div class="field">
        <label class="label" for="addr_l">사무실 주소</label>
        <div class="input-wrap">
          <input class="input" id="addr_l" name="addr_l" type="text" placeholder="사무실 주소 입력">
        </div>
      </div>

      <div class="field">
        <label class="label" for="tel_l">전화번호</label>
        <div class="input-wrap">
          <div class="phone-flex">
            <input class="input" id="tel_l" name="tel_l" type="text" placeholder="전화번호 입력">
            <button type="button" class="verify-btn">인증 요청</button>
          </div>

          <div class="verify-row">
            <input class="code-input" id="code_l" name="code_l" type="text" placeholder="인증번호 입력">
            <button type="button" class="verify-btn confirm">확인</button>
          </div>

          <p class="verify-hint">전화번호 변경 시 본인 확인이 필요합니다.</p>
        </div>
      </div>

      <div class="field">
        <span class="label">관심분야</span>
        <div class="input-wrap">
          <div class="chips">
            <label class="chip"><input type="checkbox" name="cate[]" value="성범죄"> 성범죄</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="재산범죄"> 재산범죄</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="교통사고 · 범죄"> 교통사고 · 범죄</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="폭행 · 협박"> 폭행 · 협박</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="명예훼손 · 모욕"> 명예훼손 · 모욕</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="부동산 · 임대차"> 부동산 · 임대차</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="금전 · 계약 문제"> 금전 · 계약 문제</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="가족"> 가족</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="회사"> 회사</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="의료 · 세금 · 행정"> 의료 · 세금 · 행정</label>
            <label class="chip"><input type="checkbox" name="cate[]" value="지식재산 · 금융"> 지식재산 · 금융</label>
          </div>
        </div>
      </div>

      <section class="profile-block">
        <div class="inline-top">

          <div class="photo-area">
            <div class="photo-box" id="photoPreview">
              <span>사진</span>
            </div>
            <div class="photo-actions">
              <label class="photo-upload-btn" for="photoInput">사진 변경</label>
              <button class="photo-upload-btn sub" type="button" id="photoRemoveBtn">삭제</button>
            </div>
            <input type="file" id="photoInput" name="photo" accept="image/*">
          </div>

          <div class="profile-col">
            <div>
              <div class="sub-label mainline">한줄소개</div>
              <input class="input" id="intro" name="intro" type="text" placeholder="한줄소개">
            </div>

            <div>
              <div class="sub-label">상담 가능 요일 및 시간대</div>

              <div class="days-row" id="dayCheckboxes">
                <input type="checkbox" id="mon" value="월"><label for="mon">월</label>
                <input type="checkbox" id="tue" value="화"><label for="tue">화</label>
                <input type="checkbox" id="wed" value="수"><label for="wed">수</label>
                <input type="checkbox" id="thu" value="목"><label for="thu">목</label>
                <input type="checkbox" id="fri" value="금"><label for="fri">금</label>
                <input type="checkbox" id="sat" value="토"><label for="sat">토</label>
                <input type="checkbox" id="sun" value="일"><label for="sun">일</label>
              </div>

              <div class="time-block">
                <input id="timeStart" class="time-input" type="time">
                <span class="time-tilde">~</span>
                <input id="timeEnd" class="time-input" type="time">
                <button type="button" class="small-btn" id="addTime">추가</button>
              </div>

              <div id="selectedList" class="selected-list"></div>
            </div>
          </div>

        </div>
      </section>

      <div class="actions">
        <button class="btn-main btn-ghost" type="button">취소</button>
        <button class="btn-main" id="saveBtn" type="submit">정보수정</button>
      </div>

    </form>
  </section>
</main>

<script>
(function(){
  const telInput=document.getElementById('tel_l');
  const reqBtn=document.querySelector('.phone-flex .verify-btn');
  const codeInput=document.getElementById('code_l');
  const confirmBtn=document.querySelector('.verify-row .verify-btn.confirm');
  let requested=false,verified=false;

  reqBtn.addEventListener('click',function(){
    if(verified)return;
    requested=true;
    telInput.readOnly=true;
    reqBtn.disabled=true;
    reqBtn.textContent='요청됨';
  });

  confirmBtn.addEventListener('click',function(){
    if(!requested||verified)return;
    const codeVal=codeInput.value.trim();
    if(!codeVal){alert('인증번호를 입력하세요');return;}
    verified=true;
    confirmBtn.disabled=true;
    confirmBtn.textContent='인증완료';
    telInput.readOnly=true;
    reqBtn.disabled=true;
    reqBtn.textContent='완료됨';
  });

  telInput.addEventListener('input',function(){
    requested=false;
    verified=false;
    reqBtn.disabled=false;
    reqBtn.textContent='인증 요청';
    confirmBtn.disabled=false;
    confirmBtn.textContent='확인';
    codeInput.value='';
  });

  const addBtn=document.getElementById('addTime');
  const startEl=document.getElementById('timeStart');
  const endEl=document.getElementById('timeEnd');
  const dayWrap=document.getElementById('dayCheckboxes');
  const listEl=document.getElementById('selectedList');

  function getCheckedDays(){
    return Array.from(dayWrap.querySelectorAll('input[type="checkbox"]:checked')).map(c=>c.value);
  }

  function addSlot(){
    const days=getCheckedDays(),s=startEl.value,e=endEl.value;
    if(!days.length||!s||!e)return;
    const tag=document.createElement('span');
    tag.className='tag-slot';
    const label=document.createElement('span');
    label.textContent=days.join(', ')+' '+s+'~'+e;
    const removeBtn=document.createElement('button');
    removeBtn.className='tag-remove';
    removeBtn.type='button';
    removeBtn.innerHTML='✕';
    removeBtn.addEventListener('click',()=>tag.remove());
    tag.append(label,removeBtn);
    listEl.append(tag);
    startEl.value='';
    endEl.value='';
    dayWrap.querySelectorAll('input[type="checkbox"]').forEach(c=>c.checked=false);
  }

  if(addBtn) addBtn.addEventListener('click',addSlot);

  const photoInput=document.getElementById('photoInput');
  const photoPreview=document.getElementById('photoPreview');
  const photoRemoveBtn=document.getElementById('photoRemoveBtn');

  if(photoInput){
    photoInput.addEventListener('change',function(){
      const file=this.files&&this.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=function(e){
        photoPreview.innerHTML='<img src="'+e.target.result+'" alt="미리보기">';
      };
      reader.readAsDataURL(file);
    });
  }

  if(photoRemoveBtn){
    photoRemoveBtn.addEventListener('click',function(){
      photoInput.value='';
      photoPreview.innerHTML='<span>사진</span>';
    });
  }
})();
</script>

</body>
</html>
