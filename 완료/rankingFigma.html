<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>랭킹 - LawLex</title>
    <link href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css" rel="stylesheet">
    <style>
        @import url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408@1.0/gooorm.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gooorm Sans', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .page-ranking {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* 타이틀 섹션 */
        .title-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .title-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .crown-icon {
            font-size: 48px;
        }

        .title-section h1 {
            font-size: 36px;
            font-weight: 700;
            color: #000;
        }

        .filter-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 40px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 1px solid #000777;
            background-color: white;
            color: #000777;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Gooorm Sans', sans-serif;
        }

        .filter-btn.active {
            background-color: #000777;
            color: white;
        }

        .filter-btn:hover {
            background-color: #000777;
            color: white;
        }

        /* TOP 10 랭킹 */
        .tops {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 60px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            background: white;
            transition: all 0.3s;
        }

        .rank-item:hover {
            box-shadow: 0 4px 12px rgba(0, 7, 119, 0.12);
            transform: translateY(-2px);
        }

        .top-1 {
            border: 2px solid #FFD700;
            background: linear-gradient(135deg, #fffef7 0%, #ffffff 100%);
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.2);
        }

        .top-2 {
            border: 2px solid #C0C0C0;
            background: linear-gradient(135deg, #f9f9fc 0%, #ffffff 100%);
        }

        .top-3 {
            border: 2px solid #CD7F32;
            background: linear-gradient(135deg, #fff9f5 0%, #ffffff 100%);
        }

        .rank-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: center;
        }

        .rank-number {
            font-weight: 700;
            color: #000777;
            min-width: 50px;
        }

        .top-1 .rank-number {
            font-size: 32px;
            color: #FFD700;
        }

        .top-2 .rank-number {
            font-size: 28px;
            color: #C0C0C0;
        }

        .top-3 .rank-number {
            font-size: 24px;
            color: #CD7F32;
        }

        .rank-photo {
            width: 60px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            background: #f0f0f0;
            border: 2px solid #e1e4e8;
        }

        .top-1 .rank-photo,
        .top-2 .rank-photo,
        .top-3 .rank-photo {
            width: 75px;
            height: 100px;
            border-width: 3px;
        }

        .top-1 .rank-photo {
            border-color: #FFD700;
        }

        .top-2 .rank-photo {
            border-color: #C0C0C0;
        }

        .top-3 .rank-photo {
            border-color: #CD7F32;
        }

        .rank-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank-name {
            font-weight: 500;
            flex: 1;
            text-align: center;
        }

        .top-1 .rank-name {
            font-size: 24px;
            font-weight: 700;
        }

        .top-2 .rank-name {
            font-size: 22px;
            font-weight: 700;
        }

        .top-3 .rank-name {
            font-size: 20px;
            font-weight: 700;
        }

        .rank-name a {
            color: #000;
            text-decoration: none;
            transition: color 0.2s;
        }

        .rank-name a:hover {
            color: #000777;
        }

        .rank-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
        }

        .top-1 .stat-item,
        .top-2 .stat-item,
        .top-3 .stat-item {
            font-size: 15px;
            font-weight: 500;
        }

        .stat-value {
            color: #000777;
            font-weight: 700;
        }

        /* 카테고리별 섹션 */
        .category-section {
            margin-bottom: 50px;
        }

        .category-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 100%);
            border-radius: 12px;
        }

        .category-header h2 {
            font-size: 32px;
            font-weight: 700;
            color: #000;
        }

        .category-group {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000777;
            padding-left: 10px;
            border-left: 4px solid #000777;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .rank-card {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .rank-card:hover {
            box-shadow: 0 8px 20px rgba(0, 7, 119, 0.12);
            transform: translateY(-4px);
        }

        .card-rank {
            font-size: 18px;
            font-weight: 700;
            color: #000777;
            margin-bottom: 15px;
        }

        .rank-card:nth-child(1) .card-rank {
            color: #FFD700;
            font-size: 20px;
        }

        .rank-card:nth-child(2) .card-rank {
            color: #C0C0C0;
        }

        .rank-card:nth-child(3) .card-rank {
            color: #CD7F32;
        }

        .card-photo {
            width: 90px;
            height: 120px;
            border-radius: 8px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            border: 3px solid #e1e4e8;
            overflow: hidden;
        }

        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank-card:nth-child(1) .card-photo {
            border-color: #FFD700;
        }

        .rank-card:nth-child(2) .card-photo {
            border-color: #C0C0C0;
        }

        .rank-card:nth-child(3) .card-photo {
            border-color: #CD7F32;
        }

        .card-name {
            font-size: 16px;
            font-weight: 700;
            color: #000;
            margin-bottom: 10px;
            text-align: center;
        }

        .card-stats {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .card-stats div {
            margin: 4px 0;
        }

        .card-stat-value {
            color: #000777;
            font-weight: 700;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .filter-wrapper {
                justify-content: center;
            }

            .title-section h1 {
                font-size: 28px;
            }

            .crown-icon {
                font-size: 36px;
            }

            .rank-item {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .rank-left {
                width: 100%;
                justify-content: flex-start;
            }

            .rank-stats {
                width: 100%;
                justify-content: space-around;
            }

            .category-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .top-1 .rank-number {
                font-size: 24px;
            }

            .top-2 .rank-number {
                font-size: 22px;
            }

            .top-3 .rank-number {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="page-ranking">
        <div class="container">
            <!-- 타이틀 섹션 -->
            <div class="title-section">
                <div class="title-content">
                    <div class="crown-icon">👑</div>
                    <h1>랭킹 TOP 10</h1>
                </div>
            </div>

            <!-- 필터 버튼 -->
            <div class="filter-wrapper">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-sort="likes">좋아요순</button>
                    <button class="filter-btn" data-sort="answers">답변수순</button>
                </div>
            </div>

            <!-- TOP 10 랭킹 -->
            <div class="tops" id="topRankings">
                <!-- JavaScript로 동적 생성 -->
            </div>

            <!-- 카테고리별 -->
            <section class="category-section">
                <div class="category-header">
                    <h2>카테고리별</h2>
                </div>

                <!-- 카테고리 1 -->
                <div class="category-group">
                    <h3 class="category-title">카테고리1</h3>
                    <div class="category-grid category-grid-1">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>

                <!-- 카테고리 2 -->
                <div class="category-group">
                    <h3 class="category-title">카테고리2</h3>
                    <div class="category-grid category-grid-2">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>

                <!-- 카테고리 3 -->
                <div class="category-group">
                    <h3 class="category-title">카테고리3</h3>
                    <div class="category-grid category-grid-3">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // 랭킹 데이터
        const rankingData = [
            { name: '김하나 변호사', likes: 3451, answers: 3951, photo: 'https://images.unsplash.com/photo-1736939681295-bb2e6759dddc?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=200' },
            { name: '박도윤 변호사', likes: 3047, answers: 3210, photo: 'https://images.unsplash.com/photo-1758599543154-76ec1c4257df?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=200' },
            { name: '이서준 변호사', likes: 2890, answers: 3001, photo: 'https://images.unsplash.com/photo-1736939678218-bd648b5ef3bb?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=200' },
            { name: '최가연 변호사', likes: 2105, answers: 2420 },
            { name: '정하린 변호사', likes: 1980, answers: 2335 },
            { name: '윤시우 변호사', likes: 1760, answers: 2204 },
            { name: '오주원 변호사', likes: 1695, answers: 2102 },
            { name: '서민재 변호사', likes: 1620, answers: 2050 },
            { name: '장하늬 변호사', likes: 1540, answers: 1988 },
            { name: '백도형 변호사', likes: 1480, answers: 1901 },
        ];

        // 카테고리 데이터
        const categoryData = [
            { name: '김민지 변호사', likes: 1200, answers: 1150, photo: 'https://images.unsplash.com/photo-1736939681295-bb2e6759dddc?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=200' },
            { name: '이준호 변호사', likes: 1100, answers: 1050, photo: 'https://images.unsplash.com/photo-1758599543154-76ec1c4257df?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=200' },
            { name: '박서연 변호사', likes: 1000, answers: 1200, photo: 'https://images.unsplash.com/photo-1736939678218-bd648b5ef3bb?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=200' },
            { name: '정우진 변호사', likes: 950, answers: 980 },
            { name: '최예린 변호사', likes: 900, answers: 920 },
        ];

        let currentSort = 'likes';

        // TOP 10 렌더링
        function renderTopRankings(sortBy) {
            const container = document.getElementById('topRankings');
            const sorted = [...rankingData].sort((a, b) => b[sortBy] - a[sortBy]);

            container.innerHTML = sorted.map((item, index) => {
                const rank = index + 1;
                const rankClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
                const hasPhoto = item.photo && rank <= 3;

                // 정렬 기준에 따라 표시할 통계 결정
                const statLabel = sortBy === 'likes' ? '좋아요' : '답변수';
                const statValue = sortBy === 'likes' ? item.likes : item.answers;

                return `
          <div class="rank-item ${rankClass}">
            <div class="rank-left">
              <div class="rank-number">${rank}위</div>
              ${hasPhoto ? `
                <div class="rank-photo">
                  <img src="${item.photo}" alt="${item.name}">
                </div>
              ` : ''}
              <div class="rank-name">
                <a href="#">${item.name}</a>
              </div>
            </div>
            <div class="rank-stats">
              <div class="stat-item">${statLabel} <span class="stat-value">${statValue.toLocaleString()}</span></div>
            </div>
          </div>
        `;
            }).join('');
        }

        // 카테고리 렌더링
        function renderCategory(gridClass, categoryNum, sortBy) {
            const container = document.querySelector(`.category-grid-${categoryNum}`);
            const sorted = [...categoryData].sort((a, b) => b[sortBy] - a[sortBy]);

            container.innerHTML = sorted.map((item, index) => {
                const rank = index + 1;

                // 정렬 기준에 따라 표시할 통계 결정
                const statLabel = sortBy === 'likes' ? '좋아요' : '답변수';
                const statValue = sortBy === 'likes' ? item.likes : item.answers;

                return `
          <div class="rank-card">
            <div class="card-rank">${rank}위</div>
            <div class="card-photo">
              ${item.photo ? `<img src="${item.photo}" alt="${item.name}">` : ''}
            </div>
            <div class="card-name">${item.name}</div>
            <div class="card-stats">
              <div>${statLabel} <span class="card-stat-value">${statValue.toLocaleString()}</span></div>
            </div>
          </div>
        `;
            }).join('');
        }

        // 필터 버튼
        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(button => {
            button.addEventListener('click', function () {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentSort = this.dataset.sort;

                // TOP 10과 카테고리 모두 업데이트
                renderTopRankings(currentSort);
                renderCategory('category-grid-1', 1, currentSort);
                renderCategory('category-grid-2', 2, currentSort);
                renderCategory('category-grid-3', 3, currentSort);
            });
        });

        // 초기 렌더링
        renderTopRankings('likes');
        renderCategory('category-grid-1', 1, 'likes');
        renderCategory('category-grid-2', 2, 'likes');
        renderCategory('category-grid-3', 3, 'likes');
    </script>
</body>

</html>
