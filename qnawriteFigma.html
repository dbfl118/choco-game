<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 글쓰기 - LawLex</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/GmarketSansMedium.woff');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'GmarketSansMedium', sans-serif;
      background-color: #ffffff;
      color: #333;
      line-height: 1.6;
    }

    .qnawrite-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .form-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #333;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: #000777;
    }

    .form-input::placeholder {
      color: #999;
    }

    .form-textarea {
      width: 100%;
      min-height: 400px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 14px;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    .form-textarea:focus {
      border-color: #000777;
    }

    .form-textarea::placeholder {
      color: #999;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 4px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background-color: #f5f5f5;
      color: #666;
    }

    .btn-cancel:hover {
      background-color: #e8e8e8;
    }

    .btn-submit {
      background-color: #000777;
      color: white;
    }

    .btn-submit:hover {
      background-color: #000555;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .checkbox-input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #000777;
    }

    .checkbox-label {
      font-size: 14px;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 768px) {
      .qnawrite-container {
        padding: 40px 15px;
      }

      .form-textarea {
        min-height: 300px;
      }

      .form-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="qnawrite-container">
    <div class="form-wrapper">
      <form id="qnaForm">
        <!-- 제목 -->
        <div class="form-group">
          <label class="form-label">제목</label>
          <input 
            type="text" 
            class="form-input" 
            placeholder="제목을 입력하세요"
            id="titleInput"
            required
          >
        </div>

        <!-- 내용 -->
        <div class="form-group">
          <label class="form-label">내용</label>
          <textarea 
            class="form-textarea" 
            placeholder="내용을 입력하세요"
            id="contentTextarea"
            required
          ></textarea>
        </div>

        <!-- 비밀글 설정 -->
        <div class="checkbox-group">
          <input 
            type="checkbox" 
            id="secretCheck" 
            class="checkbox-input"
          >
          <label for="secretCheck" class="checkbox-label">비밀글로 작성</label>
        </div>

        <!-- 버튼 -->
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="cancelBtn">취소</button>
          <button type="submit" class="btn btn-submit">글쓰기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Form submission
    const qnaForm = document.getElementById('qnaForm');
    qnaForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const title = document.getElementById('titleInput').value.trim();
      const content = document.getElementById('contentTextarea').value.trim();
      const isSecret = document.getElementById('secretCheck').checked;

      if (!title) {
        alert('제목을 입력해주세요.');
        return;
      }

      if (!content) {
        alert('내용을 입력해주세요.');
        return;
      }

      console.log('QnA 작성:', {
        title,
        content,
        isSecret
      });

      alert('문의가 등록되었습니다.');
      // Navigate to QnA list page
      // window.location.href = 'qna.html';
    });

    // Cancel button
    const cancelBtn = document.getElementById('cancelBtn');
    cancelBtn.addEventListener('click', function() {
      if (confirm('작성을 취소하시겠습니까?')) {
        // Navigate back to QnA list page
        // window.location.href = 'qna.html';
        console.log('작성 취소');
      }
    });
  </script>
</body>
</html>
