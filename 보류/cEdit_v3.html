<!DOCTYPE html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>칼럼 수정 v3</title><style>
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Gooorm Sans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/gooorm-sans-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
:root{--navy:#000777; --ink:#0f172a; --muted:#6b7280; --line:#e2e6ff; --soft:#f7f8ff; --paper:#ffffff;}

*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--paper); color:var(--ink); font-family:'Gooorm Sans',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Roboto,Segoe UI,Arial,sans-serif;}
.wrap{width:min(920px,94%); margin:80px auto; border-top:2px solid var(--navy); border-bottom:2px solid var(--navy); padding:18px 0 28px;}
.title{font-size:26px; font-weight:700; margin:0 0 12px;}
.form{display:grid; grid-template-columns:120px 1fr; gap:12px 14px; align-items:center;}
.form label{color:var(--muted);}
.form input[type=text]{height:40px; padding:0 12px; border:1px solid var(--line); border-radius:10px; width:100%;}
.form textarea{min-height:260px; border:1px solid var(--line); border-radius:12px; padding:12px; resize:none;}
.form .file{display:flex; align-items:center; gap:10px;}
.preview{width:260px; aspect-ratio:3/4; object-fit:cover; border:1px solid var(--line); border-radius:12px; background:#fff;}
.actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
.btn{height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--navy); font-weight:700; cursor:pointer;}
.btn:hover{background:var(--soft);}
.note{font-size:13px; color:var(--muted);}
</style></head><body>
<div class="wrap">
  <h1 class="title">칼럼 수정</h1>
  <form class="form" onsubmit="return false">
    <label for="title">제목</label><input id="title" type="text" value="기존 제목">
    <label>작성자</label><div>등록된 변호사 프로필 자동 표시(수정 불가)</div>
    <label for="img">대표 이미지</label>
    <div class="file"><input id="img" type="file" accept="image/*"><img id="prev" class="preview" src="https://placehold.co/540x720?text=%EA%B8%B0%EC%A1%B4+3%3A4" alt="미리보기"></div>
    <div></div><div class="note">대표 이미지는 3:4 권장. 1장만 사용합니다.</div>
    <label for="content">내용</label><textarea id="content">기존 내용</textarea>
  </form>
  <div class="actions"><button class="btn" type="button">취소</button><button class="btn" type="button">수정완료</button></div>
</div>

<script>
(function(){
  const input=document.getElementById('img'); const prev=document.getElementById('prev');
  input.addEventListener('change', ()=>{ const f=input.files&&input.files[0]; if(!f) return; prev.src=URL.createObjectURL(f); });
})();
</script>
</body></html>
