<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문의게시판 메인</title>
  <style>
    .page-gnaList {
      --ink: #000000;
      --muted: #6b7280;
      --line: #e5e7eb;
      --navy: #000777;
      --soft: #f5f6ff;
    }

    .page-gnaList,
    .page-gnaList * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, sans-serif;
    }

    .page-gnaList {
      display: flex;
      justify-content: center;
      margin: 100px 0px;
    }

    .page-gnaList .container {
      width: min(1000px, 100%);
    }

    .page-gnaList h1 {
      font-size: 36px;
      margin: 0 0 16px;
    }

    .page-gnaList .btn {
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 6px;
      height: 30px;
      padding: 0 12px;
      font-size: 13px;
      cursor: pointer
    }

    .page-gnaList .btn.outline {
      background: #fff;
      border: 1px solid var(--navy);
      color: var(--navy)
    }

    .page-gnaList .searchbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 36px 0 12px
    }

    .page-gnaList .search {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .page-gnaList .search input {
      width: 220px;
      height: 28px;
      border: 1px solid #e0e6ff;
      border-radius: 6px;
      padding: 0 10px 0 26px;
      outline: none
    }

    .page-gnaList .search svg {
      position: absolute;
      left: 6px;
      width: 16px;
      height: 16px;
    }

    /* Table list */
    .page-gnaList table {
      width: 100%;
      border-collapse: collapse;
    }

    .page-gnaList thead th {
      text-align: left;
      color: #1a1a1a;
      padding: 10px 8px;
      border-bottom: 2px solid #0b2a8e;
      font-size: 16px
    }

    .page-gnaList tbody td {
      padding: 12px 8px;
      border-bottom: 2px solid rgba(11, 42, 142, .18)
    }

    .page-gnaList .lock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e8eefc;
      color: var(--navy);
      margin-right: 6px;
      font-size: 12px
    }

    .page-gnaList .check {
      color: var(--navy);
      font-weight: 700;
      font-size: 18px
    }

    .page-gnaList .pager {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      margin: 20px 0 0;
      color: #555
    }

    /* Write / Detail forms */
    .page-gnaList .labelrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #333;
      margin-bottom: 6px
    }

    .page-gnaList .input {
      width: 100%;
      height: 40px;
      border: 1.6px solid var(--navy);
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      background: #fff
    }

    .page-gnaList .textarea {
      width: 100%;
      min-height: 240px;
      border: 1.6px solid var(--navy);
      border-radius: 8px;
      padding: 12px;
      outline: none;
      resize: vertical;
      background: #fff
    }

    .page-gnaList .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px
    }

    .page-gnaList .meta-line {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #333;
      border-bottom: 1.6px solid var(--navy);
      padding-bottom: 4px;
      margin-bottom: 8px
    }

    .page-gnaList .subtext {
      font-size: 12px;
      color: #444;
      margin: 6px 0
    }

    /* FAQ */
    .page-gnaList .faq-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 16px
    }

    .page-gnaList .faq h2 {
      font-size: 40px;
      margin: 6px 0 8px
    }

    .page-gnaList .qa {
      border: 1px solid #e7e7e7;
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0;
      background: #fafafa
    }

    .page-gnaList .qa .q {
      font-weight: 800
    }

    .page-gnaList .qa .a {
      color: #333;
      margin-top: 6px
    }
  </style>
</head>
