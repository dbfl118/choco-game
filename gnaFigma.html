<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 - LawLex</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/GmarketSansMedium.woff');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'GmarketSansMedium', sans-serif;
      background-color: #ffffff;
      color: #333;
      line-height: 1.6;
    }

    .qna-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .qna-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .search-wrapper {
      flex: 1;
      max-width: 400px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #666;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 40px;
      border: 1px solid #ddd;
      border-bottom: 2px solid #FFD700;
      background-color: #FFFEF0;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 14px;
      outline: none;
    }

    .search-input::placeholder {
      color: #999;
    }

    .my-posts-btn {
      padding: 10px 20px;
      background-color: #000777;
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .my-posts-btn:hover {
      background-color: #000555;
    }

    .qna-table-wrapper {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .qna-table {
      width: 100%;
      border-collapse: collapse;
    }

    .qna-table thead {
      background-color: #f8f9fa;
      border-bottom: 2px solid #000777;
    }

    .qna-table th {
      padding: 16px 12px;
      text-align: center;
      font-weight: 500;
      font-size: 14px;
      color: #333;
    }

    .qna-table th:nth-child(1) {
      width: 80px;
    }

    .qna-table th:nth-child(2) {
      width: auto;
      text-align: left;
    }

    .qna-table th:nth-child(3) {
      width: 100px;
    }

    .qna-table th:nth-child(4) {
      width: 120px;
    }

    .qna-table tbody tr {
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s;
    }

    .qna-table tbody tr:hover {
      background-color: #f8f9fa;
    }

    .qna-table tbody tr:last-child {
      border-bottom: none;
    }

    .qna-table td {
      padding: 16px 12px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .qna-table td:nth-child(2) {
      text-align: left;
    }

    .title-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lock-icon {
      width: 16px;
      height: 16px;
      color: #999;
      flex-shrink: 0;
    }

    .title-text {
      color: #333;
      cursor: pointer;
    }

    .title-text:hover {
      color: #000777;
      text-decoration: underline;
    }

    .secret-text {
      color: #999;
      font-style: italic;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      color: #28a745;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .page-arrow {
      width: 24px;
      height: 24px;
      color: #999;
      cursor: pointer;
      transition: color 0.2s;
    }

    .page-arrow:hover {
      color: #000777;
    }

    .page-arrow.disabled {
      color: #ddd;
      cursor: not-allowed;
    }

    .page-number {
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .page-number:hover {
      background-color: #f0f0f0;
      color: #000777;
    }

    .page-number.active {
      background-color: #000777;
      color: white;
      font-weight: 500;
    }

    .qna-footer {
      display: flex;
      justify-content: flex-end;
    }

    .write-btn {
      padding: 12px 30px;
      background-color: #000777;
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'GmarketSansMedium', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    .write-btn:hover {
      background-color: #000555;
    }

    @media (max-width: 768px) {
      .qna-container {
        padding: 40px 15px;
      }

      .qna-header {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
      }

      .search-wrapper {
        max-width: 100%;
      }

      .qna-table th:nth-child(1),
      .qna-table td:nth-child(1) {
        display: none;
      }

      .qna-table th,
      .qna-table td {
        padding: 12px 8px;
        font-size: 13px;
      }
    }
  </style>
</head>

  <script>
    // Search functionality
    const searchInput = document.querySelector('.search-input');
    searchInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const searchTerm = this.value.trim();
        if (searchTerm) {
          console.log('Searching for:', searchTerm);
          // Add search functionality here
        }
      }
    });

    // My posts filter
    const myPostsBtn = document.querySelector('.my-posts-btn');
    myPostsBtn.addEventListener('click', function() {
      console.log('Show only my posts');
      // Add filter functionality here
    });

    // Table row click
    const titleTexts = document.querySelectorAll('.title-text');
    titleTexts.forEach(title => {
      title.addEventListener('click', function() {
        console.log('Navigate to QnA detail page');
        // Add navigation functionality here
      });
    });

    // Pagination
    let currentPage = 1;
    const totalPages = 100;
    
    const pageNumbers = document.querySelectorAll('.page-number');
    pageNumbers.forEach(pageNum => {
      pageNum.addEventListener('click', function() {
        const page = parseInt(this.textContent);
        currentPage = page;
        
        // Update active state
        pageNumbers.forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        
        console.log('Navigate to page:', page);
        // Add pagination functionality here
      });
    });
    
    const pageArrows = document.querySelectorAll('.page-arrow:not(.disabled)');
    pageArrows.forEach(arrow => {
      arrow.addEventListener('click', function() {
        console.log('Navigate to page');
        // Add pagination functionality here
      });
    });

    // Write button
    const writeBtn = document.querySelector('.write-btn');
    writeBtn.addEventListener('click', function() {
      console.log('Navigate to QnA write page');
      // Add navigation functionality here
    });
